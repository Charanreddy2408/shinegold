name: shine_gold
description: Shine Gold Organic Agro Invention - field executive & admin app.
publish_to: 'none'
version: 1.0.15+15

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  table_calendar: ^3.1.3
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  audioplayers: ^6.4.0
  record: ^6.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  path_provider: ^2.1.6
  connectivity_plus: ^7.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Launcher icon generation. Regenerate after changing the source image:
#   dart run flutter_launcher_icons
#
# app_icon.png must be 1024x1024 with a transparent background. Android 8+
# masks adaptive icons into circles/squircles and crops the outer edges, so
# adaptive_icon_foreground keeps the artwork inside the safe centre zone.
flutter_launcher_icons:
  image_path: assets/icons/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  web:
    generate: true
  windows:
    generate: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/maps/india_states.json

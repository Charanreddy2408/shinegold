name: Build & release APK

# Push a tag like v1.0.4 and this builds the production APK and publishes it
# to a GitHub Release. Version comes from pubspec.yaml — bump it before tagging.
# Also runnable by hand from the Actions tab (no release is published then).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Without it the"
            echo "::error::APK is debug-signed with a throwaway key and testers cannot"
            echo "::error::install it over an existing build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/shinegold-release.jks
          cat > android/key.properties <<EOF
          storeFile=shinegold-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=shinegold
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get

      - name: Read version from pubspec
        id: version
        run: |
          FULL=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "app=${FULL%%+*}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP="${{ steps.version.outputs.app }}"
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $APP."
            echo "::error::Bump pubspec.yaml and re-tag so the APK name matches the release."
            exit 1
          fi

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - run: flutter test

      - name: Build release APK
        run: |
          DEFINES=$(python3 -c "import json;print(' '.join(f'--dart-define={k}={v}' for k,v in json.load(open('dart_defines/production.json')).items()))")
          echo "Building with: $DEFINES"
          flutter build apk --release $DEFINES

      - name: Name the artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/ShineGold-${{ steps.version.outputs.app }}.apk"

      - name: Confirm the APK is release-signed
        run: |
          APK="dist/ShineGold-${{ steps.version.outputs.app }}.apk"
          SIGNER=$(unzip -p "$APK" META-INF/*.RSA | keytool -printcert | grep -m1 Owner || true)
          echo "Signed by: $SIGNER"
          if echo "$SIGNER" | grep -qi "Android Debug"; then
            echo "::error::APK is debug-signed — the release keystore was not applied."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ShineGold-${{ steps.version.outputs.app }}
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Shine Gold ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
